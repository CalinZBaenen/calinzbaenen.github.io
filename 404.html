<!DOCTYPE html>





<html lang="en-US" dir="ltr">
	<head>
		<!-- Document metadata. -->
		<base href="./" />
		
		<meta content="telephone=no, address=no, date=no" name="format-detection" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" charset="UTF-8" content="text/html; charset=UTF-8" />
		<meta content="width=device-width, height=device-height, initial-scale=1" name="viewport" />
		<meta content="Calin Z. Baenen" name="author" />
		
		
		
		<!-- Title, favicon, and description. -->
		<title>404 | Calin Baenen</title>
		<link href="./favicon.ico" type="image/x-icon" rel="shortcut icon" />
		<link href="./favicon.ico" type="image/x-icon" rel="icon" />
		
		
		
		<!-- Stylesheets. (Loaded in the order of importance.) -->
		<link href="./assets/base.css" type="text/css" rel="stylesheet" />
	</head>
	
	
	
	<body>
		<header>
			<div aria-hidden="true" id="__katty-container">
				<img draggable="false" type="image/png" alt="" src="./assets/images/Katty/emblem.png" />
			</div>
			<h1>404 : Page Does Not Exist</h1>
		</header>
		
		<main id="site-body">
			<p>
				The URL you were trying to visit
				<span><span class="code" id="__url-placeholder"></span></span>
				can not be found here.
			</p>
		</main>
		
		<nav id="navpanel">
			<div id="hotlinks">
				<a aria-label="Back to homepage." href="./">Back to homepage.</a>
			</div>
		</nav>
		
		<footer>
			<span draggable="false">
				View the code from the GitHub repository,
				<a tabindex="-1" href="https://github.com/CalinZBaenen/calinzbaenen.github.io">CalinZBaenen/calinzbaenen.github.io</a>.
			</span>
		</footer>
		
		
		
		<!-- Insert the URL of the document the user was trying to access. -->
		<script>
			try {
				const url = document.getElementById("__url-placeholder");
				url.innerText = document.location.href;
				url.outerHTML = '('+url.outerHTML+')';
			} catch(e) {
				console.error(e.name + ": " + e.message);
			}
		</script>
	</body>
</html>
